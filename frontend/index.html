<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Farmer's Buddy</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- ===== HEADER ===== -->
  <header>
    <div class="logo">🌾 Farmer's Buddy</div>

    <div class="category-links">
      <button class="cat-btn active" data-category="">All</button>
      <button class="cat-btn" data-category="Seeds">Seeds</button>
      <button class="cat-btn" data-category="Fertilizers">Fertilizers</button>
      <button class="cat-btn" data-category="Equipment">Equipment</button>
      <button class="cat-btn" data-category="Irrigation">Irrigation</button>
    </div>

    <div class="header-actions">
      <button id="ordersBtn">📦 My Orders</button>
      <button id="cartBtn">🛒 Cart (<span id="cartCount">0</span>)</button>
      <button id="loginBtn">Login</button>
      <span id="userName" class="hidden"></span>
      <button id="logoutBtn" class="hidden">Logout</button>
    </div>
  </header>

  <!-- ===== BANNER ===== -->
  <section class="banner">
    <h1>Everything You Need for a Better Harvest</h1>
    <p>Seeds, Fertilizers, Equipment & Irrigation — all in one place</p>
  </section>

  <!-- ===== PRODUCTS GRID ===== -->
  <main>
    <h2 id="sectionTitle">All Products</h2>
    <div id="productGrid" class="product-grid"></div>
  </main>

  <!-- ===== LOGIN / REGISTER MODAL ===== -->
  <div id="authModal" class="modal hidden">
    <div class="modal-box">
      <button class="close-btn" data-close="authModal">✕</button>
      <div class="tabs">
        <button class="tab-btn active" data-tab="loginForm">Login</button>
        <button class="tab-btn" data-tab="registerForm">Register</button>
      </div>

      <form id="loginForm" class="auth-form">
        <input type="email" id="loginEmail" placeholder="Email" required />
        <input type="password" id="loginPassword" placeholder="Password" required />
        <button type="submit">Login</button>
        <p class="form-message" id="loginMessage"></p>
      </form>

      <form id="registerForm" class="auth-form hidden">
        <input type="text" id="registerName" placeholder="Full Name" required />
        <input type="email" id="registerEmail" placeholder="Email" required />
        <input type="password" id="registerPassword" placeholder="Password (min 6 chars)" required />
        <button type="submit">Create Account</button>
        <p class="form-message" id="registerMessage"></p>
      </form>
    </div>
  </div>

  <!-- ===== CART MODAL ===== -->
  <div id="cartModal" class="modal hidden">
    <div class="modal-box">
      <button class="close-btn" data-close="cartModal">✕</button>
      <h2>Your Cart</h2>
      <div id="cartItems"></div>
      <div class="cart-total">Total: ₹<span id="cartTotal">0</span></div>
      <button id="placeOrderBtn" class="place-order-btn">Place Order</button>
      <p class="form-message" id="orderMessage"></p>
    </div>
  </div>

  <!-- ===== ORDER CONFIRMATION MODAL ===== -->
  <div id="orderConfirmModal" class="modal hidden">
    <div class="modal-box">
      <button class="close-btn" data-close="orderConfirmModal">✕</button>
      <div class="confirm-icon">✅</div>
      <h2>Order Placed!</h2>
      <p id="orderConfirmText" class="confirm-text"></p>
    </div>
  </div>

  <!-- ===== MY ORDERS MODAL ===== -->
  <div id="ordersModal" class="modal hidden">
    <div class="modal-box">
      <button class="close-btn" data-close="ordersModal">✕</button>
      <h2>My Orders</h2>
      <div id="ordersList"></div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
